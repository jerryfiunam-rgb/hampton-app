<title>Hampton Court · Estados de cuenta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Condominio / Análisis de estados de cuenta — Workflow con IA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior + riel de etapas (columna en escritorio, carrusel en móvil) + panel de trabajo.
   Paleta: azul marino para estructura, verde como acento (especificación). Tema oscuro deliberado. */
:root {
  /* Tema claro único, tomado del logo: papel crema, ladrillo Tudor, marco de pizarra y verde de jardín. */
  --paper: #f4efe6;
  --surface: #fbf8f2;
  --surface-2: #f1eadf;
  --surface-3: #e7ddcc;
  --line: #d8ccb8;
  --line-strong: #b9aa92;
  --ink: #23211a;
  --ink-2: #4f4a3e;
  --ink-3: #7b7363;
  --brick: #a5532a;
  --brick-deep: #7f3c1b;
  --on-brick: #fffaf3;
  --brick-soft: rgba(165, 83, 42, .12);
  --slate: #5f5d52;
  --ivy: #4c6420;
  --ivy-soft: rgba(76, 100, 32, .13);
  --crit: #b3261e;
  --crit-soft: rgba(179, 38, 30, .10);
  --mod: #9a6200;
  --mod-soft: rgba(196, 128, 0, .14);
  --obs: #2f5f8a;
  --obs-soft: rgba(47, 95, 138, .11);
  --src-pdf: #7a4fb0;
  --src-motor: #1f6f7d;
  --src-user: #9a6200;
  --src-ia: #4c6420;
  --f-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-head: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }
a { color: var(--brick); }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.topbar { background: var(--surface); border-bottom: 3px double var(--line-strong);
  padding-block: 18px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.topbar .logo { width: 84px; height: auto; display: block; filter: drop-shadow(0 2px 3px rgba(35,33,26,.18)); }
.topbar h1.apptitle { font-family: var(--f-display); font-weight: 700; font-size: clamp(19px, 2.6vw, 28px); letter-spacing: .03em; line-height: 1.2; color: var(--ink); }
.topbar h1.apptitle span { color: var(--brick); }
.topbar .addr { font-size: 13px; color: var(--ink-3); }
.conn { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.ok { background: var(--ivy); box-shadow: 0 0 0 3px var(--ivy-soft); }
.dot.warn { background: var(--mod); }
.dot.err { background: var(--crit); }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; }
.rail { background: var(--surface-2); border-right: 1px solid var(--line); padding: 18px 12px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.step { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2); }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); background: var(--surface-2); }
.step .t { font-size: 14px; line-height: 1.2; }
.step .s { display: block; font-size: 11px; color: var(--ink-3); font-family: var(--f-mono); letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
.step:hover:not(:disabled) { background: var(--surface-2); }
.step[aria-current="step"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--brick); border-color: var(--line); color: var(--ink); }
.step[aria-current="step"] .n { border-color: var(--brick); color: var(--brick); }
.step.done .n { background: var(--ivy); color: #fff; border-color: var(--ivy); }
.step:disabled { opacity: .45; cursor: not-allowed; }
.rail .note { margin-top: 18px; font-size: 12px; color: var(--ink-3); padding: 0 6px; }

main { min-width: 0; padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.stage-head { display: flex; flex-direction: column; gap: 6px; }
.stage-head .k { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; color: var(--brick-deep); text-transform: uppercase; }
h1, h2, h3 { font-family: var(--f-head); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 27px; line-height: 1.2; letter-spacing: .01em; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
.lead { color: var(--ink-2); max-width: 70ch; margin: 0; }
p { margin: 0; }

.panel { background: var(--surface); box-shadow: 0 1px 2px rgba(35,33,26,.05); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.flat { background: transparent; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
label.f .hint { font-size: 12px; color: var(--ink-3); }
label.f > .src, .mini > .src, .kpi .l > .src { align-self: flex-start; }
label.f > .src, .mini > .src { margin-top: -2px; }
input[type=text], input[type=number], input[type=password], select, textarea {
  background: #fffdf9; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 90px; }
input:disabled, select:disabled, textarea:disabled { opacity: .6; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--brick); width: 16px; height: 16px; flex: none; }

.btn { display: inline-flex; box-shadow: 0 1px 0 rgba(35,33,26,.06); align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn.primary { background: var(--brick); border-color: var(--brick); color: var(--on-brick); }
.btn.primary:hover:not(:disabled) { background: var(--brick-deep); border-color: var(--brick-deep); }
.btn.danger { color: var(--crit); border-color: rgba(179,38,30,.45); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.actionbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding-top: 4px; }
.status { font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.status.err { color: var(--crit); }
.status .sub { color: var(--ink-3); font-size: 12px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--brick-soft); border-top-color: var(--brick); border-radius: 50%; animation: spin .9s linear infinite; display: inline-block; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

.banner { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 12px 14px; font-size: 14px; color: var(--ink-2); display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { border-color: rgba(196,128,0,.5); background: var(--mod-soft); color: var(--ink); }
.banner.err { border-color: rgba(179,38,30,.5); background: var(--crit-soft); color: var(--ink); }
.banner.ok { border-color: rgba(76,100,32,.45); background: var(--ivy-soft); color: var(--ink); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill.critical { background: var(--crit-soft); color: var(--crit); border-color: rgba(179,38,30,.35); }
.pill.moderate { background: var(--mod-soft); color: var(--mod); border-color: rgba(196,128,0,.35); }
.pill.observation { background: var(--obs-soft); color: var(--obs); border-color: rgba(47,95,138,.35); }
.pill.ok { background: var(--ivy-soft); color: var(--ivy); }
.pill.bad { background: var(--crit-soft); color: var(--crit); }
.pill.neutral { background: var(--surface-3); color: var(--ink-2); border-color: var(--line); }

.src { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; vertical-align: 1px; white-space: nowrap; }
.src.pdf { color: var(--src-pdf); }
.src.motor { color: var(--src-motor); }
.src.user { color: var(--src-user); }
.src.ia { color: var(--src-ia); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-3); align-items: center; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.flag td { background: rgba(179,38,30,.05); }
tr.unc td { background: rgba(196,128,0,.07); }
td select { min-width: 190px; padding: 6px 8px; font-size: 13px; }
td input[type=number] { width: 130px; padding: 6px 8px; font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--ink-3); }
.kpi .v { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.month { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.month > summary { list-style: none; cursor: pointer; padding: 14px 16px; background: var(--surface-2); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.month > summary::-webkit-details-marker { display: none; }
.month > summary h3 { min-width: 90px; }
.month .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.mini { display: flex; flex-direction: column; font-size: 12px; color: var(--ink-3); }
.mini b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-size: 14px; }

.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--paper); }
.drop.over { border-color: var(--brick); background: var(--brick-soft); }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.files li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--surface-2); }
.files .fn { font-weight: 600; overflow-wrap: anywhere; }
.files .meta { font-size: 12px; color: var(--ink-3); font-family: var(--f-mono); }

.q { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.q.blocking { border-color: rgba(179,38,30,.55); }
.finding { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-left-width: 4px; }
.finding.critical { border-left-color: var(--crit); }
.finding.moderate { border-left-color: var(--mod); }
.finding.observation { border-left-color: var(--obs); }
.finding.sel { outline: 2px solid var(--brick); outline-offset: -1px; }
.finding .hd { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.finding .ev { font-size: 13px; color: var(--ink-2); }
.order { display: flex; flex-direction: column; gap: 8px; }
.order li { list-style: none; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
.order .rk { font-family: var(--f-mono); font-size: 18px; color: var(--brick); text-align: center; }
.order ol { padding: 0; margin: 0; }

.chart { width: 100%; height: auto; color: var(--ink-2); display: block; }
.pill.scan { background: var(--obs-soft); color: var(--obs); border-color: rgba(47,95,138,.3); font-size: 10.5px; padding: 0 6px; }
.doc { background: #fffdf9; color: #23211a; border: 1px solid var(--line); border-radius: var(--r); padding: 28px; overflow-x: auto; }
.doc .chart { color: #4f4a3e; }

details.log { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.log > summary { cursor: pointer; padding: 12px 16px; font-size: 13px; color: var(--ink-2); }
details.log .inner { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.modal-bg { position: fixed; inset: 0; background: rgba(35,33,26,.45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; width: min(520px, 100%); display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow: auto; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; }
  .rail ol { flex-direction: row; gap: 6px; width: max-content; }
  .step { grid-template-columns: 26px auto; padding: 6px 8px; }
  .step .s { display: none; }
  .rail .note { display: none; }
  h1 { font-size: 23px; }
  .doc { padding: 16px; }
}

.muted { color: var(--ink-3); font-size: 13px; }
.doc .note { border: 1px solid #d8ccb8; border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.doc .muted { color: #7b7363; }

/* Observaciones de Claude en la confirmación de datos */
.notes { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.notes > summary { cursor: pointer; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; list-style: none; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::before { content: "▸"; color: var(--ink-3); margin-right: -6px; transition: transform .15s; }
.notes[open] > summary::before { transform: rotate(90deg); }
.notes-t { font-weight: 600; font-size: 14px; flex: 1; display: inline-flex; gap: 8px; align-items: center; }
.notes-c { display: flex; flex-wrap: wrap; gap: 6px; }
.nk { font-size: 12px; padding: 1px 9px; border-radius: 999px; font-weight: 600; border: 1px solid transparent; }
.nk.inconsistencia { background: var(--mod-soft); color: var(--mod); }
.nk.hipotesis { background: var(--obs-soft); color: var(--obs); }
.nk.lectura { background: var(--surface-3); color: var(--ink-2); }
.nk.verificacion { background: var(--ivy-soft); color: var(--ivy); }
.notes-b { padding: 0 14px 14px; display: grid; gap: 14px; }
.ng h4 { margin: 0 0 8px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.ng ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ng li { border-left: 3px solid var(--line-strong); background: var(--surface-2); border-radius: 0 8px 8px 0; padding: 9px 12px; display: grid; gap: 3px; max-width: 80ch; }
.ng li strong { font-size: 14px; color: var(--ink); }
.ng li p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.ng.inconsistencia li { border-left-color: var(--mod); }
.ng.hipotesis li { border-left-color: var(--obs); }
.ng.verificacion li { border-left-color: var(--ivy); }
.amt { font-family: var(--f-mono); font-size: .95em; color: var(--ink); white-space: nowrap; }
@media (min-width: 900px) { .notes-b { grid-template-columns: repeat(2, minmax(0, 1fr)); } .notes-b .ng.inconsistencia { grid-column: 1 / -1; } }

/* Texto justificado en toda la aplicación (párrafos y listas; no en tablas, botones ni encabezados) */
p, li, .lead, .banner, .check > span, .ng li p, .fbody, .plane li > span:last-child { text-align: justify; text-justify: inter-word; hyphens: auto; -webkit-hyphens: auto; }
.topbar, .topbar *, .drop, .drop * { text-align: center; }
.topbar p, .drop p { text-align: center; }
.lead { max-width: 75ch; }
.summary { font-size: 15.5px; line-height: 1.6; max-width: 80ch; }

/* Diagnóstico: tres planos */
.planes { display: grid; gap: 14px; }
.plane { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.plane header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.plane-k { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.plane-s { font-size: 12.5px; color: var(--ink-3); }
.plane ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plane li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 14.5px; line-height: 1.55; }
.plane li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; align-self: start; }
.plane.fact { background: #eef3f3; border: 1px solid #c4d8db; }
.plane.fact .plane-k { color: var(--src-motor); }
.plane.fact li { grid-template-columns: auto auto minmax(0, 1fr); color: var(--ink); }
.plane.fact li::before { background: var(--src-motor); border-radius: 2px; }
.plane.interp { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brick); }
.plane.interp .plane-k { color: var(--brick-deep); }
.plane.interp li { color: var(--ink-2); font-family: Georgia, "Times New Roman", serif; font-size: 15.5px; }
.plane.interp li::before { background: var(--brick); }
.plane.hyp { background: transparent; border: 1.5px dashed #9fb3c9; }
.plane.hyp .plane-k { color: var(--obs); }
.plane.hyp li { color: var(--ink-2); font-style: italic; }
.plane.hyp li::before { background: transparent; border: 1.5px solid var(--obs); }

/* Hallazgo: filas etiquetadas por plano */
.frow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.flabel { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
.fbody { min-width: 0; display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.fbody p { margin: 0; }
.fbody ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.frow.fact .flabel { color: var(--src-motor); }
.frow.fact .fbody { color: var(--ink); }
.frow.fact .fbody > ul { background: #eef3f3; border-radius: 8px; padding: 8px 12px 8px 28px; }
.frow.interp .flabel { color: var(--brick-deep); }
.frow.interp .fbody { font-family: Georgia, "Times New Roman", serif; font-size: 15px; color: var(--ink-2); }
.frow.hyp .flabel { color: var(--obs); }
.frow.hyp .fbody { font-style: italic; }
.frow.rec .flabel { color: var(--ivy); }
.frow.rec .fbody { color: var(--ink); font-weight: 500; }
.evt table { font-size: 12.5px; }

<script type="module">
const __m_condominio_mjs = (() => {
// Motor condominial: categorías, validación aritmética, indicadores y reglas de anomalías.
// Código puro (sin DOM ni red): lo usan el navegador, el servidor y las pruebas.

const TOL = 1; // tolerancia de cuadre en MXN

const CATEGORIES = [
  { id: 'ING_ORD', label: 'Ingresos ordinarios', group: 'ingreso', kw: ['CUOTA', 'MANTENIMIENTO MENS', 'PAGO MENSUAL', 'QUINCENA', 'CONDOMINIAL', 'PENALIZACION', 'RECARGO', 'MANTTO DEPTO', 'PAGO DEPTO', 'DEPTO'] },
  { id: 'ING_EXT', label: 'Ingresos extraordinarios', group: 'ingreso', kw: ['EXTRAORDINARI', 'FONDO DE RESERVA', 'FONDO RESERVA', 'RENTA SALON', 'RENTA JARDIN', 'RENTA DE SALON', 'RENTA DE JARDIN', 'RENTA ESPACIO', 'APORTACION IMPERMEAB', 'APORTACION CANALETA'] },
  { id: 'CUOTAS_PEND', label: 'Cuotas pendientes de aplicar', group: 'ingreso', kw: ['ANTICIPO', 'POR APLICAR', 'PENDIENTE DE APLICAR', 'SIN REFERENCIA'] },
  { id: 'INTERESES', label: 'Intereses bancarios', group: 'ingreso', kw: ['INTERES', 'RENDIMIENTO', 'INVERSION'] },
  { id: 'TRANSFER', label: 'Transferencias entre fondos', group: 'neutral', kw: ['TRASPASO ENTRE', 'TRASPASO PROPIO', 'ENTRE CUENTAS PROPIAS', 'TRASPASO A FONDO', 'TRASPASO DE FONDO'] },
  { id: 'EF_SEGURIDAD', label: 'Egresos fijos — Seguridad', group: 'fijo', kw: ['VIGILANCIA', 'GUARDIA', 'SEGURIDAD', 'POLICIA'] },
  { id: 'EF_LIMPIEZA', label: 'Egresos fijos — Limpieza', group: 'fijo', kw: ['LIMPIEZA', 'INTENDENCIA', 'DESINFECCION'] },
  { id: 'EF_AREAS_VERDES', label: 'Egresos fijos — Áreas verdes', group: 'fijo', kw: ['JARDIN', 'PODA', 'FERTILIZ'] },
  { id: 'EF_RECOLECCION', label: 'Egresos fijos — Recolección', group: 'fijo', kw: ['BASURA', 'RECOLECCION', 'RESIDUOS'] },
  { id: 'EF_CONTABILIDAD', label: 'Egresos fijos — Contabilidad', group: 'fijo', kw: ['CONTADOR', 'CONTABILIDAD', 'CONTABLE'] },
  { id: 'EF_TELEFONIA', label: 'Egresos fijos — Telefonía/Internet', group: 'fijo', kw: ['TELEFON', 'INTERNET', 'TOTALPLAY', 'TELMEX', 'IZZI', 'INTERFON', 'INTERCOMUNIC'] },
  { id: 'EF_ENERGIA', label: 'Egresos fijos — Energía eléctrica', group: 'fijo', kw: ['CFE', 'COMISION FEDERAL', 'LUZ', 'ALUMBRADO', 'ENERGIA ELECTRICA'] },
  { id: 'EV_FUMIGACION', label: 'Egresos variables — Fumigación', group: 'variable', kw: ['FUMIGA', 'PLAGA', 'ROEDOR'] },
  { id: 'EV_MANTENIMIENTO', label: 'Egresos variables — Mantenimiento', group: 'variable', kw: ['REPARACION', 'PINTURA', 'MATERIAL', 'REFACCION', 'HERRAMIENTA', 'PLOMER', 'ELECTRICISTA', 'BOMBA', 'HERRERIA'] },
  { id: 'EV_SOFTWARE', label: 'Egresos variables — Software', group: 'variable', kw: ['VIVOOK', 'SOFTWARE', 'PLATAFORMA', 'SUSCRIPCION', 'LICENCIA'] },
  { id: 'EV_IMPUESTOS', label: 'Egresos variables — Impuestos', group: 'variable', kw: ['SAT', 'ISR', 'IMPUESTO', 'RETENCION', 'DECLARACION'] },
  { id: 'HONORARIOS', label: 'Honorarios de administración', group: 'admin', kw: ['HONORARIOS ADMIN', 'ADMINISTRACION', 'ADMINISTRADOR', 'ADMINISTRADORA'] },
  { id: 'CAJA_CHICA', label: 'Reembolso caja chica', group: 'admin', kw: ['CAJA CHICA', 'REEMBOLSO', 'REPOSICION'] },
  { id: 'IMPERMEABILIZACION', label: 'Impermeabilización', group: 'especial', kw: ['IMPERMEAB'] },
  { id: 'CANALETAS', label: 'Canaletas / instalaciones', group: 'especial', kw: ['CANALETA', 'INSTALACION'] },
  { id: 'COMISIONES', label: 'Comisiones bancarias', group: 'banco', kw: ['COMISION', 'IVA COM', 'CARGO POR SERVICIO', 'MEMBRESIA', 'ANUALIDAD'] },
  { id: 'NO_CLASIFICADO', label: 'No clasificado', group: 'otro', kw: [] },
];
const CATEGORY_IDS = CATEGORIES.map(c => c.id);
const catLabel = id => (CATEGORIES.find(c => c.id === id) || CATEGORIES.at(-1)).label;
const catGroup = id => (CATEGORIES.find(c => c.id === id) || CATEGORIES.at(-1)).group;
const FIXED_CATS = CATEGORIES.filter(c => c.group === 'fijo').map(c => c.id);
const LEVELS = ['critical', 'moderate', 'observation'];
const LEVEL_LABEL = { critical: 'Crítico', moderate: 'Moderado', observation: 'Observación' };
const KINDS = ['arithmetic_error', 'continuity_error', 'missing_payment', 'unusual_expense', 'potential_duplicate', 'committed_funds', 'irregular_fixed', 'observation'];

const INCOME_ONLY = new Set(['ING_ORD', 'ING_EXT', 'CUOTAS_PEND', 'INTERESES']);

function normText(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
}

// Sugiere categoría por palabras clave del concepto bancario. El orden importa:
// las categorías especiales y de egreso específico se evalúan antes que las genéricas.
const ORDER_EXPENSE = ['IMPERMEABILIZACION', 'CANALETAS', 'TRANSFER', 'CAJA_CHICA', 'HONORARIOS', 'EF_SEGURIDAD', 'EF_LIMPIEZA', 'EF_AREAS_VERDES', 'EF_RECOLECCION', 'EF_CONTABILIDAD', 'EF_TELEFONIA', 'EF_ENERGIA', 'EV_FUMIGACION', 'EV_SOFTWARE', 'EV_IMPUESTOS', 'EV_MANTENIMIENTO', 'COMISIONES'];
const ORDER_INCOME = ['TRANSFER', 'INTERESES', 'CUOTAS_PEND', 'ING_EXT', 'ING_ORD'];
function suggestCategory(concept, type) {
  const t = normText(concept);
  if (!t) return 'NO_CLASIFICADO';
  const order = type === 'abono' ? ORDER_INCOME : ORDER_EXPENSE;
  for (const id of order) {
    const c = CATEGORIES.find(x => x.id === id);
    if (c.kw.some(k => t.includes(k))) return id;
  }
  if (type === 'abono' && /IMPERMEAB|CANALETA|RESERVA/.test(t)) return 'ING_EXT';
  return 'NO_CLASIFICADO';
}

function detectFund(concept) {
  const t = normText(concept);
  if (t.includes('IMPERMEAB')) return 'Impermeabilización';
  if (t.includes('CANALETA')) return 'Canaletas';
  if (t.includes('RESERVA')) return 'Fondo de reserva';
  if (t.includes('ANTICIPO')) return 'Anticipos de condóminos';
  return null;
}

const isCash = concept => /EFECTIVO|DEP\.? EFVO|DEPOSITO EN VENTANILLA/.test(normText(concept));
const JUSTIFIED_CASH = /RENTA|SALON|JARDIN|RECIBO|FACTURA|CUOTA/;

const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const num = v => (v === null || v === undefined || v === '' || !Number.isFinite(Number(v)) ? null : Number(v));

// Convierte "1,234.56", "$ 1 234.56", "(1,234.56)" a número.
function parseAmount(s) {
  if (typeof s === 'number') return s;
  const raw = String(s || '').trim();
  if (!raw) return null;
  const neg = /^\(.*\)$/.test(raw) || /^-/.test(raw);
  const clean = raw.replace(/[^0-9.,]/g, '');
  if (!clean) return null;
  let v;
  if (/,\d{2}$/.test(clean) && !/\.\d{2}$/.test(clean)) v = Number(clean.replace(/\./g, '').replace(',', '.'));
  else v = Number(clean.replace(/,/g, ''));
  if (!Number.isFinite(v)) return null;
  return neg ? -v : v;
}

const fmtMXN = n => (n === null || n === undefined || !Number.isFinite(Number(n)))
  ? 'No identificado'
  : Number(n).toLocaleString('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2 });

// ---------- Mapeo mensual ----------

function movementTotals(movs) {
  let income = 0, expense = 0, unknown = 0;
  for (const m of movs) {
    if (m.amount === null || m.amount === undefined) { unknown++; continue; }
    if (m.type === 'abono') income += Number(m.amount); else expense += Number(m.amount);
  }
  return { income: round2(income), expense: round2(expense), unknown };
}

// Recalcula totales y cuadre de un mes a partir de sus movimientos (fuente de verdad del motor).
function recomputeMonth(month) {
  const all = [...(month.movements || []), ...(month.unclassifiedMovements || [])];
  // re-separa movimientos no clasificados por categoría
  const movements = all.filter(m => m.category !== 'NO_CLASIFICADO');
  const unclassifiedMovements = all.filter(m => m.category === 'NO_CLASIFICADO');
  const t = movementTotals(all);
  const ini = num(month.initialBalance), fin = num(month.finalBalance);
  const expectedFinal = ini === null ? null : round2(ini + t.income - t.expense);
  const diff = expectedFinal === null || fin === null ? null : round2(fin - expectedFinal);
  const balanceCheck = diff !== null && Math.abs(diff) <= TOL && t.unknown === 0;
  // comparación con totales reportados en el resumen del estado de cuenta
  const rI = num(month.reportedIncome), rE = num(month.reportedExpense);
  const reportedDiff = (ini !== null && fin !== null && rI !== null && rE !== null) ? round2(fin - (ini + rI - rE)) : null;
  return {
    ...month,
    movements, unclassifiedMovements,
    totalIncome: t.income, totalExpense: t.expense, unknownAmounts: t.unknown,
    expectedFinal, balanceDiff: diff, balanceCheck,
    reportedDiff,
    incomeVsReported: rI === null ? null : round2(t.income - rI),
    expenseVsReported: rE === null ? null : round2(t.expense - rE),
  };
}

function sortMonths(months) {
  return [...months].sort((a, b) => String(a.period).localeCompare(String(b.period)));
}

function continuityChecks(months) {
  const ms = sortMonths(months);
  const out = [];
  for (let i = 1; i < ms.length; i++) {
    const prev = ms[i - 1], cur = ms[i];
    const a = num(prev.finalBalance), b = num(cur.initialBalance);
    const consecutive = nextPeriod(prev.period) === cur.period;
    const diff = a === null || b === null ? null : round2(b - a);
    out.push({ from: prev.period, to: cur.period, consecutive, prevFinal: a, nextInitial: b, diff, ok: diff !== null && Math.abs(diff) <= TOL });
  }
  return out;
}

function nextPeriod(p) {
  const [y, m] = String(p).split('-').map(Number);
  if (!y || !m) return null;
  return m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`;
}

// Preguntas que genera el motor: montos no identificados y no clasificados.
function engineQuestions(months) {
  const qs = [];
  for (const m of months) {
    if (num(m.initialBalance) === null) qs.push({ id: `q-ini-${m.period}`, period: m.period, prompt: `No se identificó el saldo inicial de ${m.period}. Indica el monto según el estado de cuenta.`, blocking: true, kind: 'balance', field: 'initialBalance' });
    if (num(m.finalBalance) === null) qs.push({ id: `q-fin-${m.period}`, period: m.period, prompt: `No se identificó el saldo final de ${m.period}. Indica el monto según el estado de cuenta.`, blocking: true, kind: 'balance', field: 'finalBalance' });
    for (const mv of [...(m.movements || []), ...(m.unclassifiedMovements || [])]) {
      if (mv.amount === null || mv.amount === undefined) {
        qs.push({ id: `q-amt-${mv.id}`, period: m.period, movementId: mv.id, prompt: `Monto no identificado para «${mv.concept}» (${mv.date}). Indica el monto.`, blocking: true, kind: 'amount' });
      } else if (mv.category === 'NO_CLASIFICADO' && Number(mv.amount) > 3000) {
        qs.push({ id: `q-cat-${mv.id}`, period: m.period, movementId: mv.id, prompt: `¿Qué categoría corresponde a «${mv.concept}» (${mv.date}, ${fmtMXN(mv.amount)}, ${mv.type})?`, blocking: mv.type === 'cargo' && Number(mv.amount) > 5000, kind: 'category' });
      }
    }
  }
  return qs;
}

// ---------- Fondos especiales ----------
function computeFunds(months, openingBalances = {}) {
  const map = new Map();
  const touch = (name) => { if (!map.has(name)) map.set(name, { name, buildingOrScope: '', amountCollected: 0, amountPaid: 0, opening: num(openingBalances[name]) || 0, lastUpdated: null }); return map.get(name); };
  for (const m of sortMonths(months)) {
    for (const mv of [...(m.movements || []), ...(m.unclassifiedMovements || [])]) {
      let fund = mv.fund || null;
      if (!fund && mv.category === 'IMPERMEABILIZACION') fund = 'Impermeabilización';
      if (!fund && mv.category === 'CANALETAS') fund = 'Canaletas';
      if (!fund && mv.category === 'CUOTAS_PEND') fund = 'Anticipos de condóminos';
      if (!fund || mv.amount === null) continue;
      const f = touch(fund);
      if (mv.scope && !f.buildingOrScope.includes(mv.scope)) f.buildingOrScope = [f.buildingOrScope, mv.scope].filter(Boolean).join(', ');
      if (mv.type === 'abono') f.amountCollected += Number(mv.amount); else f.amountPaid += Number(mv.amount);
      f.lastUpdated = mv.date || m.period;
    }
  }
  for (const k of Object.keys(openingBalances)) touch(k);
  return [...map.values()].map(f => ({ ...f, amountCollected: round2(f.amountCollected), amountPaid: round2(f.amountPaid), balance: round2(f.opening + f.amountCollected - f.amountPaid) }));
}

// ---------- Indicadores (módulo 8.2) ----------
function categoryTotalsByMonth(months) {
  const res = {};
  for (const m of sortMonths(months)) {
    const t = {};
    for (const mv of [...(m.movements || []), ...(m.unclassifiedMovements || [])]) {
      if (mv.amount === null) continue;
      const key = mv.category;
      t[key] = t[key] || { cargo: 0, abono: 0 };
      t[key][mv.type] += Number(mv.amount);
    }
    for (const k in t) { t[k].cargo = round2(t[k].cargo); t[k].abono = round2(t[k].abono); }
    res[m.period] = t;
  }
  return res;
}

const pct = (a, b) => (b ? round2((a / b) * 100) : null);

function computeIndicators(months, condo = {}, fundOpenings = {}) {
  const ms = sortMonths(months.map(recomputeMonth));
  const cats = categoryTotalsByMonth(ms);
  const units = num(condo.units), fee = num(condo.monthlyFee), debt = num(condo.delinquentDebt);
  const flow = ms.map((m, i) => {
    const c = cats[m.period] || {};
    const fixed = FIXED_CATS.reduce((s, k) => s + (c[k]?.cargo || 0), 0);
    const ordinaryIncome = c.ING_ORD?.abono || 0;
    const theoretical = units && fee ? units * fee : null;
    const prev = ms[i - 1];
    const net = round2(m.totalIncome - m.totalExpense);
    const varSaldo = num(m.initialBalance) !== null && num(m.finalBalance) !== null ? round2(m.finalBalance - m.initialBalance) : null;
    return {
      period: m.period,
      initialBalance: num(m.initialBalance), finalBalance: num(m.finalBalance),
      totalIncome: m.totalIncome, totalExpense: m.totalExpense,
      netFlow: net, balanceVariation: varSaldo,
      flowVsVariationDiff: varSaldo === null ? null : round2(varSaldo - net),
      balanceCheck: m.balanceCheck, balanceDiff: m.balanceDiff,
      incomeChangePct: prev && prev.totalIncome ? pct(m.totalIncome - prev.totalIncome, prev.totalIncome) : null,
      expenseChangePct: prev && prev.totalExpense ? pct(m.totalExpense - prev.totalExpense, prev.totalExpense) : null,
      ordinaryIncome: round2(ordinaryIncome),
      theoreticalIncome: theoretical,
      collectionRatePct: theoretical ? pct(ordinaryIncome, theoretical) : null,
      fixedExpense: round2(fixed),
      fixedConcentrationPct: m.totalExpense ? pct(fixed, m.totalExpense) : null,
      ordinaryExpense: round2(m.totalExpense - ['IMPERMEABILIZACION', 'CANALETAS', 'TRANSFER'].reduce((s, k) => s + (c[k]?.cargo || 0), 0)),
    };
  });

  // composición de egresos del período y variación mensual por categoría
  const composition = {};
  for (const p in cats) for (const k in cats[p]) if (cats[p][k].cargo) composition[k] = round2((composition[k] || 0) + cats[p][k].cargo);
  const totalExp = Object.values(composition).reduce((a, b) => a + b, 0);
  const compositionList = Object.entries(composition).map(([id, amount]) => ({ id, label: catLabel(id), amount, pct: pct(amount, totalExp) })).sort((a, b) => b.amount - a.amount);

  const categoryChanges = [];
  for (let i = 1; i < ms.length; i++) {
    const a = cats[ms[i - 1].period] || {}, b = cats[ms[i].period] || {};
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    for (const k of keys) {
      const pa = a[k]?.cargo || 0, pb = b[k]?.cargo || 0;
      if (!pa) continue;
      const ch = pct(pb - pa, pa);
      categoryChanges.push({ category: k, label: catLabel(k), from: ms[i - 1].period, to: ms[i].period, prev: pa, cur: pb, changePct: ch, flagged: Math.abs(ch) > 20 });
    }
  }

  const funds = computeFunds(ms, fundOpenings);
  const committed = round2(funds.reduce((s, f) => s + Math.max(0, f.balance), 0));
  const last = ms.at(-1);
  const bankBalance = last ? num(last.finalBalance) : null;
  const free = bankBalance === null ? null : round2(bankBalance - committed);
  const avgOrdExp = flow.length ? round2(flow.reduce((s, f) => s + f.ordinaryExpense, 0) / flow.length) : null;
  const totalOrdIncome = flow.reduce((s, f) => s + f.ordinaryIncome, 0);
  const annualizedOrd = flow.length ? round2((totalOrdIncome / flow.length) * 12) : null;

  return {
    months: flow,
    composition: compositionList,
    categoryChanges,
    funds,
    committedFunds: committed,
    bankBalance,
    committedPct: bankBalance ? pct(committed, bankBalance) : null,
    freeBalance: free,
    avgOrdinaryExpense: avgOrdExp,
    monthsCovered: free !== null && avgOrdExp ? round2(free / avgOrdExp) : null,
    delinquencyIndexPct: debt !== null && annualizedOrd ? pct(debt, annualizedOrd) : null,
    delinquentDebt: debt,
    annualizedOrdinaryIncome: annualizedOrd,
    periodFrom: ms[0]?.period || null, periodTo: last?.period || null,
    continuity: continuityChecks(ms),
    gaps: ms.slice(1).filter((m, i) => nextPeriod(ms[i].period) !== m.period).map(m => m.period),
  };
}

// ---------- Reglas de anomalías (módulo 8.3) ----------
function allMovs(m) { return [...(m.movements || []), ...(m.unclassifiedMovements || [])]; }

function detectAnomalies(months, indicators) {
  const ms = sortMonths(months.map(recomputeMonth));
  const ind = indicators || computeIndicators(ms);
  const out = [];
  let n = 0;
  const add = (rule, level, kind, title, detail, evidence, extra = {}) => out.push({ id: `R${String(++n).padStart(2, '0')}`, rule, level, kind, title, detail, evidence: evidence.filter(Boolean), ...extra });
  const firstMov = m => allMovs(m)[0]?.id;

  for (const m of ms) {
    if (m.balanceDiff !== null && Math.abs(m.balanceDiff) > TOL) {
      add('cuadre', 'critical', 'arithmetic_error', `Descuadre aritmético en ${m.period}`,
        `Saldo inicial ${fmtMXN(m.initialBalance)} + ingresos ${fmtMXN(m.totalIncome)} − egresos ${fmtMXN(m.totalExpense)} = ${fmtMXN(m.expectedFinal)}, pero el estado reporta ${fmtMXN(m.finalBalance)}. Diferencia: ${fmtMXN(m.balanceDiff)}.`,
        [firstMov(m)], { period: m.period, amount: m.balanceDiff });
    }
    if (m.reportedDiff !== null && Math.abs(m.reportedDiff) > TOL) {
      add('cuadre', 'critical', 'arithmetic_error', `Resumen del estado no cuadra en ${m.period}`,
        `Con los totales del resumen bancario, el saldo final esperado difiere en ${fmtMXN(m.reportedDiff)}.`, [firstMov(m)], { period: m.period, amount: m.reportedDiff });
    }
  }
  for (const c of ind.continuity) {
    if (c.consecutive && c.diff !== null && Math.abs(c.diff) > TOL) {
      const mm = ms.find(x => x.period === c.to);
      add('continuidad', 'critical', 'continuity_error', `Discontinuidad de saldo ${c.from} → ${c.to}`,
        `Saldo final de ${c.from}: ${fmtMXN(c.prevFinal)}; saldo inicial de ${c.to}: ${fmtMXN(c.nextInitial)}. Diferencia: ${fmtMXN(Math.abs(c.diff))}.`,
        [firstMov(mm)], { period: c.to, amount: Math.abs(c.diff) });
    }
  }
  for (const m of ms) for (const mv of allMovs(m)) {
    if (mv.type === 'cargo' && mv.category === 'NO_CLASIFICADO' && Number(mv.amount) > 5000) {
      add('sin_categoria', 'critical', 'unusual_expense', `Egreso grande sin categoría (${m.period})`,
        `«${mv.concept}» el ${mv.date} por ${fmtMXN(mv.amount)} no tiene categoría.`, [mv.id], { period: m.period, amount: mv.amount });
    }
  }
  // honorarios no pagados
  for (let i = 1; i < ms.length; i++) {
    const has = m => allMovs(m).some(x => x.category === 'HONORARIOS' && x.type === 'cargo');
    if (has(ms[i - 1]) && !has(ms[i])) {
      const ev = allMovs(ms[i - 1]).find(x => x.category === 'HONORARIOS');
      add('honorarios', 'moderate', 'missing_payment', `Sin pago de honorarios de administración en ${ms[i].period}`,
        `En ${ms[i - 1].period} hubo pago de honorarios (${fmtMXN(ev.amount)}), pero en ${ms[i].period} no hay ningún movimiento en esa categoría.`, [ev.id], { period: ms[i].period });
    }
  }
  // gasto variable alto (mantenimiento)
  if (ms.length >= 2) {
    const tot = ms.map(m => round2(allMovs(m).filter(x => x.category === 'EV_MANTENIMIENTO' && x.type === 'cargo').reduce((s, x) => s + Number(x.amount || 0), 0)));
    ms.forEach((m, i) => {
      const others = tot.filter((_, j) => j !== i);
      const avg = others.reduce((a, b) => a + b, 0) / others.length;
      if (tot[i] > 0 && avg > 0 && tot[i] > 1.5 * avg) {
        const ev = allMovs(m).filter(x => x.category === 'EV_MANTENIMIENTO').sort((a, b) => b.amount - a.amount).slice(0, 3).map(x => x.id);
        add('mantenimiento_alto', 'moderate', 'unusual_expense', `Mantenimiento elevado en ${m.period}`,
          `Mantenimiento ${fmtMXN(tot[i])} vs. promedio de los otros meses ${fmtMXN(avg)} (${round2(tot[i] / avg)}×).`, ev, { period: m.period, amount: tot[i] });
      }
    });
  }
  // duplicados probables
  for (const m of ms) {

function buildPrompt(op, payload) {

  if (!user) throw new Error(`Operación desconocida: ${op}`);
  return { system: COMMON_INSTRUCTION, user };
}

const MAX_TOKENS = { interpret: 32000, analyze: 12000, report: 12000, alert: 8000 };

// Extrae un objeto JSON de un texto de respuesta.
function parseJsonText(text) {
  const t = String(text || '').trim();
  if (/^\s*<(!doctype|html)/i.test(t)) { const e = new Error('La respuesta llegó como HTML, no como JSON.'); e.code = 'html_response'; throw e; }
  try { return JSON.parse(t); } catch {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  const e = new Error('La respuesta de Claude no es JSON válido.'); e.code = 'invalid_json'; throw e;
}

// Valida y normaliza el resultado de cada operación. Lanza error con code 'invalid_result'.
function validateResult(op, result, payload) {
  const fail = errs => { const e = new Error(errs.slice(0, 6).join(' ')); e.code = 'invalid_result'; e.details = errs; throw e; };
  if (!result || typeof result !== 'object') fail(['Resultado vacío.']);
  if (op === 'interpret') {
    if (!Array.isArray(result.movements)) fail(['La interpretación no incluye movimientos.']);
    const month = normalizeInterpretation(result, payload.file.id, payload.file.period);
    const errs = validateMonthMapping(month);
    if (errs.length) fail(errs);
    return month;
  }
  if (op === 'analyze') {
    const ids = new Set(payload.movements.map(m => m.id));
    const findings = (result.findings || []).map((f, i) => ({ ...f, id: String(f.id || `H${i + 1}`), evidence: (f.evidence || []).map(String), hypotheses: normHyps(f.hypotheses), facts: toList(f.facts).map(x => typeof x === 'string' ? x : String(x?.text || '')).filter(Boolean), interpretation: String(f.interpretation || f.description || '') }));
    result.facts = toList(result.facts).map(x => typeof x === 'string' ? { text: x, source: 'motor' } : { text: String(x?.text || ''), source: x?.source === 'pdf' ? 'pdf' : 'motor' }).filter(x => x.text);
    result.interpretation = toList(result.interpretation || result.trends).map(String).filter(Boolean);
    result.hypotheses = normHyps(result.hypotheses);
    const errs = validateFindings(findings, ids);
    if (!result.executiveSummary) errs.push('Falta el resumen ejecutivo del diagnóstico.');
    if (errs.length) fail(errs);
    return { ...result, findings };
  }
  if (op === 'report') {
    const errs = validateReport(result, payload.findings.map(f => f.id));
    if (errs.length) fail(errs);
    return result;
  }
  if (op === 'alert') {
    const errs = validateAlert(result, payload.findings.map(f => f.id));
    if (errs.length) fail(errs);
    return result;
  }
  fail([`Operación desconocida ${op}`]);
}

return { AI_OPS, COMMON_INSTRUCTION, buildPrompt, MAX_TOKENS, parseJsonText, validateResult };
})();

function niceStep(raw) {

const PAGE_IMAGES = new Map(); // fileId -> [{number, blob}] (solo en memoria; no se guarda en el navegador)

const now = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const $ = (sel, root = document) => root.querySelector(sel);

function fresh() {
  return {
    schema: SCHEMA, version: 1, caseId: uid(), createdAt: now(), stage: 1,
    condo: { ...CONDO },
    consent: false,
    files: [], months: [], fundOpenings: {},
    meta: { bank: '', accountType: '', currency: 'MXN' },
    answers: {}, appliedAnswers: {}, corrections: [],
    confirmation: null, diagnosis: null,
    selection: [], selectionConfirmedAt: null,
    report: null, observationsDraft: '',
    review: null, alert: null, closedAt: null,
    events: [], calls: [],
  };
}

// ---------- Persistencia ----------
let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s?.schema !== SCHEMA) return null;
    return { ...fresh(), ...s, condo: { ...CONDO } };
  } catch { storageOk = false; return null; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOk = true; }
  catch { storageOk = false; }
}
let S = load() || fresh();
const restored = S.events.length > 0;

function log(type, detail = '') { S.events.push({ at: now(), type, detail: String(detail).slice(0, 300) }); save(); }

// ---------- Invalidación en cascada ----------
function invalidate(from) {
  const order = ['mapping', 'confirmation', 'diagnosis', 'selection', 'report', 'review', 'alert', 'closed'];
  const i = order.indexOf(from);
  const touched = [];
  const drop = (k, fn) => { if (order.indexOf(k) > i || k === from) { if (fn()) touched.push(k); } };
  drop('confirmation', () => { const had = !!S.confirmation; S.confirmation = null; return had && from !== 'confirmation'; });
  drop('diagnosis', () => { const had = !!S.diagnosis; S.diagnosis = null; return had; });
  drop('selection', () => { const had = S.selection.length > 0 || S.selectionConfirmedAt; if (from !== 'selection') S.selection = []; S.selectionConfirmedAt = null; return !!had; });
  drop('report', () => { const had = !!S.report; S.report = null; return had; });
  drop('review', () => { const had = !!S.review; S.review = null; return had; });
  drop('alert', () => { const had = !!S.alert; S.alert = null; return had; });
  drop('closed', () => { const had = !!S.closedAt; S.closedAt = null; return had; });
  if (touched.length) log('invalidación', `Por cambio en ${from}: se reinician ${touched.join(', ')}`);
}

// ---------- Estado derivado ----------
const months = () => E.sortMonths(S.months.map(E.recomputeMonth));
const allMovements = () => months().flatMap(m => [...m.movements, ...m.unclassifiedMovements]);
const mappingHash = () => E.hashMapping(S.months);
const confirmed = () => !!S.confirmation && S.confirmation.hash === mappingHash();
function questions() {
  const ms = months();
  const eq = E.engineQuestions(ms);
  const aiq = ms.flatMap(m => m.aiQuestions || []).filter(q => !S.appliedAnswers[q.id]);
  return [...eq, ...aiq];
}
const pendingTextAnswers = () => questions().filter(q => q.kind === 'text' && (S.answers[q.id] || '').trim());
const blockingOpen = () => questions().filter(q => q.blocking && !(q.kind === 'text' && (S.answers[q.id] || '').trim()));
function indicators() { return E.computeIndicators(months(), S.condo, S.fundOpenings); }

function enabled(n) {
  if (n === 1) return true;
  if (n === 2) return S.months.length > 0;
  if (n === 3) return confirmed();
  if (n === 4) return confirmed() && !!S.diagnosis;
  if (n === 5) return enabled(4) && !!S.selectionConfirmedAt;
  if (n === 6) return enabled(5) && !!S.report;
  if (n === 7) return enabled(6) && !!S.review?.approvedAt;
  if (n === 8) return enabled(7) && !!S.alert?.acceptedAt;
  return false;
}
function done(n) {
  return { 1: S.months.length > 0, 2: confirmed(), 3: !!S.diagnosis, 4: !!S.selectionConfirmedAt, 5: !!S.report, 6: !!S.review?.approvedAt, 7: !!S.alert?.acceptedAt, 8: !!S.closedAt }[n];
}
function go(n) { if (!enabled(n)) return; S.stage = n; save(); render(); window.scrollTo({ top: 0 }); }
if (!enabled(S.stage)) S.stage = 1;

// ---------- Conexión con Claude ----------
const AI = { mode: null, sample: null, downloads: null, server: null, model: null, checked: false, error: null };

async function initAI() {
  if (window.claude && typeof window.claude.use === 'function') {
    AI.mode = 'claude.ai';
    try { AI.sample = await window.claude.use('sample'); } catch { AI.sample = null; }
    try { AI.downloads = await window.claude.use('downloads'); } catch { AI.downloads = null; }
    try { const lim = AI.sample ? await AI.sample.limits() : null; AI.maxImages = lim?.images?.maxCount || 0; } catch { AI.maxImages = 0; }
    AI.model = 'Claude (cuenta de claude.ai del usuario)';
    if (!AI.sample) AI.error = 'Esta vista no permite llamar a Claude. Abre la aplicación en claude.ai con tu sesión iniciada.';
  } else {
    AI.mode = 'server';
    try {
      const r = await fetch('/api/status', { credentials: 'same-origin' });
      const j = await r.json();
      AI.server = j; AI.model = j.model; AI.maxImages = 8;
    } catch { AI.error = 'No se pudo consultar el servidor (/api/status).'; }
  }
  AI.checked = true;
  render();
}
const aiReady = () => AI.mode === 'claude.ai' ? !!AI.sample : !!AI.server?.connected;

let busy = null; // {key, startedAt, msg, ctl}
const errors = {}; // por acción
let tick = null;

function errorText(code, msg) {
  const map = {
    not_granted: 'No se autorizó el uso de Claude en esta página. Vuelve a intentarlo y acepta el permiso de claude.ai.',
    rate_limited: 'Se alcanzó el límite de uso. Espera un momento y reintenta; tus datos se conservan.',

    sampling_disabled: 'El uso de Claude desde páginas está desactivado para tu cuenta u organización.',
    prompt_too_large: 'El texto enviado es demasiado grande. Divide el PDF por meses o reduce páginas.',
    cancelled: 'Operación cancelada. Puedes reintentar sin perder lo completado.',
    timeout: 'Se superó el tiempo máximo de espera. Reintenta; no se perdió el avance.',
    truncated: 'La respuesta quedó truncada (límite de salida). Reintenta; si persiste, divide el PDF.',
    invalid_json: 'Claude devolvió una respuesta que no es JSON válido. Reintenta.',
    html_response: 'El servidor devolvió HTML en lugar de datos. Revisa la conexión y reintenta.',
    invalid_result: 'La respuesta no cumple el esquema requerido y se rechazó; el resultado anterior se conserva.',

  return (map[code] || 'Error inesperado.') + (msg && !map[code] ? ` ${msg}` : '') + (code === 'invalid_result' && msg ? ` Detalle: ${msg}` : '');
}

async function callAI(op, payload, key, { images = [], label = '' } = {}) {
  if (!aiReady()) { const e = new Error('not_connected'); e.code = 'not_connected'; throw e; }
  const { system, user } = buildPrompt(op, payload);
  const ctl = new AbortController();
  busy = { key, startedAt: Date.now(), msg: label ? `${label}: iniciando…` : 'Iniciando…', label, ctl, chars: 0 };
  render();
  tick = setInterval(() => { if (busy) updateBusy(); }, 8000);
  const timer = setTimeout(() => { ctl.abort(); busy && (busy.timedOut = true); }, TIMEOUT_MS[op] || 180000);
  const started = now();
  try {
    let text, usage = null, model = AI.model;
    if (AI.mode === 'claude.ai') {
      try {
        const res = await AI.sample(`${system}\n\n${user}`, {
          modelTier: op === 'interpret' ? 'default' : 'complex', cache: false, signal: ctl.signal,
          ...(images.length ? { images } : {}),
          onText: ({ text }) => { if (busy) { busy.chars = text.length; busy.msg = `${busy.label ? busy.label + ': ' : ''}recibiendo respuesta…`; updateBusy(); } },
        });
        if (res.truncated) { const e = new Error('truncated'); e.code = 'truncated'; throw e; }
        text = res.text;
        model = res.modelApplied || model;
      } catch (e) {
        if (e?.code === 'cancelled' && busy?.timedOut) { const t = new Error('timeout'); t.code = 'timeout'; throw t; }
        throw e;
      }
    } else {
      ({ text, usage, model } = await serverAI(op, payload, ctl.signal, images));
    }
    const parsed = parseJsonText(text);
    const result = validateResult(op, parsed, payload);
    S.calls.push({ action: op + (images.length ? ` (+${images.length} imágenes)` : ''), model, at: started, finishedAt: now(), inputTokens: usage?.input_tokens ?? null, outputTokens: usage?.output_tokens ?? null, approxInputChars: system.length + user.length, approxOutputChars: text.length });
    save();
    return result;
  } catch (e) {
    if (busy?.timedOut && e.code !== 'timeout') { e.code = 'timeout'; }
    throw e;
  } finally {
    clearTimeout(timer); clearInterval(tick); busy = null;
  }
}

const blobToBase64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });
async function serverAI(op, payload, signal, images = []) {
  const imgs = await Promise.all(images.map(blobToBase64));
  const r = await fetch('/api/ai', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ op, payload, images: imgs }), signal });
  const ct = r.headers.get('content-type') || '';
  if (ct.includes('text/html')) { const e = new Error('html'); e.code = 'html_response'; throw e; }
  if (!r.ok && !ct.includes('event-stream')) { let j = {}; try { j = await r.json(); } catch {} const e = new Error(j.message || r.statusText); e.code = j.code || 'upstream_error'; throw e; }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = ''; let final = null;
  try {
    for (;;) {
      const { value, done: d } = await reader.read();
      if (d) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (chunk.match(/^event: (.*)$/m) || [])[1]; const data = (chunk.match(/^data: (.*)$/m) || [])[1];
        if (!ev) continue;
        const j = data ? JSON.parse(data) : {};
        if (ev === 'progress' && busy) { busy.msg = j.message || busy.msg; busy.chars = j.chars ?? busy.chars; updateBusy(); }
        if (ev === 'error') { const e = new Error(j.message); e.code = j.code; throw e; }
        if (ev === 'result') final = j;
      }
    }
  } catch (e) { if (e.code) throw e; if (signal.aborted) { const t = new Error('timeout'); t.code = busy?.timedOut ? 'timeout' : 'cancelled'; throw t; } const x = new Error('interrupted'); x.code = 'interrupted'; throw x; }
  if (!final) { const e = new Error('interrupted'); e.code = 'interrupted'; throw e; }
  return final;
}

function updateBusy() {
  const el = document.getElementById('busy-' + busy?.key);
  if (!el || !busy) return;
  const secs = Math.round((Date.now() - busy.startedAt) / 1000);
  el.innerHTML = `<span><span class="spinner" aria-hidden="true"></span>${esc(busy.msg)} · ${secs} s${busy.chars ? ` · ${busy.chars.toLocaleString('es-MX')} caracteres recibidos` : ''}</span><span class="sub">Puedes usar otra pestaña; no cierres ni recargues esta.</span>`;
}

// ---------- Lectura de PDF ----------
// Una página se trata como escaneada si casi no tiene texto, o si contiene imágenes y poco texto.
// Esas páginas se renderizan a JPEG (solo en memoria) y Claude las lee como imagen.
const SCAN_TEXT_MIN = 120, MIXED_TEXT_MAX = 1500;
async function pageHasImages(page) {
  try {
    const ops = await page.getOperatorList();
    const O = window.pdfjsLib.OPS;
    const img = new Set([O.paintImageXObject, O.paintInlineImageXObject, O.paintImageXObjectRepeat, O.paintInlineImageXObjectGroup, O.paintJpegXObject].filter(x => x !== undefined));
    return ops.fnArray.some(fn => img.has(fn));
  } catch { return false; }
}
async function renderPage(page) {
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(2.5, 1700 / Math.max(base.width, base.height));
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
  canvas.width = canvas.height = 0;
  return blob;
}
async function extractPdf(file, id, onPage) {
  const lim = checkFileLimits(file);
  if (lim) throw Object.assign(new Error(lim), { code: 'limit' });
  if (!window.pdfjsLib) throw new Error('No se cargó el lector de PDF (PDF.js). Revisa tu conexión y recarga.');
  const buf = await file.arrayBuffer();
  const doc = await window.pdfjsLib.getDocument({ data: buf, isEvalSupported: false, disableAutoFetch: true, enableXfa: false }).promise;
  if (doc.numPages > PDF_MAX_PAGES) { await doc.destroy(); throw Object.assign(new Error(`«${file.name}» tiene ${doc.numPages} páginas; el límite es ${PDF_MAX_PAGES}. No se procesaron datos parciales.`), { code: 'limit' }); }
  const pages = [], images = [];
  for (let i = 1; i <= doc.numPages; i++) {
    onPage?.(i, doc.numPages);
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    const text = itemsToLines(tc.items).join('\n');
    const len = text.replace(/\s/g, '').length;
    const scanned = len < SCAN_TEXT_MIN || (len < MIXED_TEXT_MAX && await pageHasImages(page));
    if (scanned) images.push({ number: i, blob: await renderPage(page) });
    pages.push({ number: i, text, scanned });
    page.cleanup();
  }
  await doc.destroy();
  if (images.length) PAGE_IMAGES.set(id, images);
  const all = pages.map(p => p.text).join('\n');
  return { id, fileName: file.name, size: file.size, period: detectPeriod(all), pages, extractedAt: now(), status: 'extraído' };
}

async function addFiles(list) {
  const arr = [...list];
  errors.files = null;
  if (S.files.length + arr.length > MAX_FILES) { errors.files = `Puedes cargar hasta ${MAX_FILES} PDFs por análisis (ya hay ${S.files.length}).`; render(); return; }
  for (const f of arr) {
    const tmp = { id: uid(), fileName: f.name, size: f.size, status: 'leyendo', pages: [] };
    S.files.push(tmp); render();
    try {
      const out = await extractPdf(f, tmp.id, (i, n) => { const el = document.querySelector(`[data-reading="${tmp.id}"]`); if (el) el.textContent = `Leyendo página ${i} de ${n}…`; });
      Object.assign(tmp, out);
      const sc = out.pages.filter(p => p.scanned).length;
      log('pdf_extraido', `${f.name}: ${out.pages.length} páginas (${sc} escaneadas), período detectado ${out.period || 'no detectado'}`);
      if (S.months.length) invalidate('mapping');
    } catch (e) {
      tmp.status = 'error'; tmp.error = e.message || String(e); tmp._file = f;
      log('pdf_error', `${f.name}: ${tmp.error}`);
    }
    save(); render();
  }
}

// ---------- Acciones de IA por etapa ----------
function interpretChunks(f) {
  const imgs = PAGE_IMAGES.get(f.id) || [];
  const max = Math.max(1, Math.min(AI.maxImages || 5, 20));
  const chunks = [{ pages: [], images: [] }];
  for (const p of f.pages) {
    let cur = chunks.at(-1);
    const img = p.scanned ? imgs.find(x => x.number === p.number) : null;
    if (img && cur.images.length >= max) { cur = { pages: [], images: [] }; chunks.push(cur); }
    cur.pages.push({ ...p, imageIndex: img ? cur.images.length + 1 : null, imageMissing: p.scanned && !img });
    if (img) cur.images.push(img.blob);
  }
  return chunks;
}

// Une las partes de un mismo estado de cuenta leído en varios lotes.
function mergeParts(parts, f) {
  const first = v => parts.map(p => p[v]).find(x => x !== null && x !== undefined && x !== '');
  const lastFinal = [...parts].reverse().map(p => p.finalBalance).find(x => x !== null && x !== undefined);
  const period = parts.map(p => p.period).find(x => x && x !== f.period) || parts[0].period;
  let n = 0;
  const movements = parts.flatMap(p => [...p.movements, ...p.unclassifiedMovements]).map(m => ({ ...m, id: `${period}-${String(++n).padStart(3, '0')}` }));
  let q = 0;
  const aiQuestions = parts.flatMap(p => p.aiQuestions || []).map(x => ({ ...x, id: `q-ai-${period}-${++q}`, period }));
  return E.recomputeMonth({ ...parts[0], period, initialBalance: parts[0].initialBalance ?? first('initialBalance'), finalBalance: lastFinal ?? null, reportedIncome: first('reportedIncome') ?? null, reportedExpense: first('reportedExpense') ?? null, pettyCashBalance: first('pettyCashBalance') ?? null, bank: first('bank') || '', accountType: first('accountType') || '', movements, unclassifiedMovements: [], aiQuestions, notes: parts.flatMap(p => p.notes || []) });
}

async function runInterpret(onlyIds = null) {
  const targets = S.files.filter(f => f.status !== 'error' && f.pages?.length && (onlyIds ? onlyIds.includes(f.id) : !S.months.some(m => m.fileId === f.id)));
  if (!targets.length) { errors.interpret = 'No hay PDFs nuevos por interpretar.'; render(); return; }
  errors.interpret = null;
  for (const f of targets) {
    try {
      const prev = S.months.find(m => m.fileId === f.id);
      const hasScans = f.pages.some(p => p.scanned);
      if (hasScans && !PAGE_IMAGES.has(f.id) && !prev) throw Object.assign(new Error('Las páginas escaneadas no se conservan al recargar. Quita el archivo y vuelve a cargar el PDF.'), { code: 'reload_pdf' });
      if (hasScans && PAGE_IMAGES.has(f.id) && AI.mode === 'claude.ai' && !AI.maxImages) throw Object.assign(new Error('Esta vista no permite enviar imágenes a Claude para leer las páginas escaneadas.'), { code: 'images_unavailable' });
      const answers = prev ? (prev.aiQuestions || []).filter(q => S.answers[q.id]).map(q => ({ question: q.prompt, answer: S.answers[q.id] })) : [];
      const chunks = interpretChunks(f);
      const parts = [];
      for (let i = 0; i < chunks.length; i++) {
        const label = chunks.length > 1 ? `${f.fileName} · parte ${i + 1} de ${chunks.length}` : f.fileName;
        parts.push(await callAI('interpret', { file: { ...f, pages: chunks[i].pages }, part: chunks.length > 1 ? { index: i + 1, total: chunks.length } : null, condo: condoForAI(), previous: prev ? slimMonth(prev) : null, answers }, 'interpret', { images: chunks[i].images, label }));
      }
      const month = parts.length === 1 ? parts[0] : mergeParts(parts, f);
      const scannedPages = new Set(f.pages.filter(p => p.scanned).map(p => p.number));
      for (const m of [...month.movements, ...month.unclassifiedMovements]) m.fromScan = scannedPages.has(m.sourcePageNumber);
      const errs = E.validateMonthMapping(month);
      if (errs.length) throw Object.assign(new Error(errs.slice(0, 3).join(' ')), { code: 'invalid_result' });
      if (S.months.some(m => m.period === month.period && m.fileId !== f.id)) throw Object.assign(new Error(`El período ${month.period} ya está cargado con otro PDF. Elimina el duplicado.`), { code: 'duplicate_period' });
      // Sustituye solo si la interpretación nueva es válida.
      if (prev) for (const q of prev.aiQuestions || []) if (S.answers[q.id]) S.appliedAnswers[q.id] = { answer: S.answers[q.id], at: now() };
      S.months = S.months.filter(m => m.fileId !== f.id).concat(month);
      f.period = month.period; f.status = 'interpretado';
      if (!S.meta.bank && month.bank) S.meta.bank = month.bank;
      if (!S.meta.accountType && month.accountType) S.meta.accountType = month.accountType;
      invalidate('mapping');
      log(prev ? 'reinterpretación' : 'interpretación', `${f.fileName} → ${month.period}: ${month.movements.length + month.unclassifiedMovements.length} movimientos${scannedPages.size ? ` (${scannedPages.size} páginas escaneadas leídas como imagen)` : ''}`);
    } catch (e) {
      errors.interpret = `${f.fileName}: ${['reload_pdf', 'images_unavailable', 'duplicate_period'].includes(e.code) ? e.message : errorText(e.code, e.message)}`;
      log('error_ia', `interpret ${f.fileName}: ${e.code || ''} ${e.message}`);
      save(); render(); return false;
    }
    save(); render();
  }
  return true;
}
const slimMonth = m => ({ period: m.period, initialBalance: m.initialBalance, finalBalance: m.finalBalance, movements: [...m.movements, ...m.unclassifiedMovements].map(x => ({ date: x.date, concept: x.concept, amount: x.amount, type: x.type, category: x.category, fund: x.fund })) });

function restoreJSON(text) {
  let j;
  try { j = JSON.parse(text); } catch { throw new Error('El archivo no es JSON válido.'); }
  if (j?.schema !== SCHEMA || j.version !== 1) throw new Error('El archivo no es una copia de esta aplicación (esquema o versión distintos).');
  if (!Array.isArray(j.months) || !Array.isArray(j.files) || typeof j.condo !== 'object') throw new Error('La copia está incompleta: faltan condominio, archivos o mapeo.');
  for (const m of j.months) { const errs = E.validateMonthMapping(m); if (errs.length) throw new Error(`Mapeo inválido en ${m.period}: ${errs[0]}`); }
  for (const k of ['apiKey', 'key', 'token']) delete j[k];

}
